<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Outdoor Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
/*__STYLE__*/
<style>
.boardwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
@media (min-width: 1001px) { .table { grid-template-columns: minmax(0, 1fr) 400px; } }
/* Phones: the board first, as a side-scrolling strip at a size a finger can hit, then what the picked unit can do. */
@media (max-width: 1000px) {
  .table { grid-template-columns: minmax(0, 1fr); }
  .col { display: contents; }
  .pad { order: 1; } #unitcard { order: 2; } #status { order: 3; } #rostercard { order: 4; } .minutes { order: 5; }
  #board { min-width: 740px; }
  .boardwrap::after { content: "swipe the floor sideways"; display: block; text-align: center; font-size: 12px; color: var(--ink-soft); padding: 2px 0 4px; }
  .legend { padding: 4px 12px 12px; }
  .cards { max-height: none; }
  .mv { padding: 9px 12px; }
}
.veil { display: flex; align-items: flex-start; justify-content: center; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
button, .tile, .unit { touch-action: manipulation; -webkit-tap-highlight-color: rgba(255, 159, 210, .35); }
.sheet .stick { position: sticky; bottom: 0; background: var(--card); padding: 8px 0 4px; margin-top: 10px; box-shadow: 0 -10px 12px -10px rgba(0,0,0,.25); }
.sheet .stick .who { margin: 0 0 6px; }
/* Touch screens have no hover: never let a first tap be spent on one. */
@media (hover: none) {
  .mv:hover:not(:disabled), .job:hover, .btn:hover, .rrow:hover { box-shadow: none; }
  .mv:hover:not(:disabled) { background: #fff; }
  .slide:not(.picked):hover { box-shadow: none; }
}
.sheet { margin: 4vh auto auto; }
.keybox > summary { cursor: pointer; font-family: var(--hand); font-size: 22px; padding: 2px 22px 6px; color: var(--ink-soft); list-style: none; }
.keybox > summary::-webkit-details-marker { display: none; }
.keybox > summary::before { content: "▸ "; } .keybox[open] > summary::before { content: "▾ "; }
.fold > summary { cursor: pointer; list-style: none; padding: 2px 0; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::before { content: "▸ "; } .fold[open] > summary::before { content: "▾ "; }
.bar { height: 7px; border: 1.5px solid var(--ink); border-radius: 2px; background: #fff; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--you); }
.bar.them i { background: var(--them); }
.unit h3 { font-family: var(--hand); font-size: 30px; line-height: 1; margin: 0; }
.unit .job { color: var(--ink-soft); font-size: 13px; margin: 2px 0 6px; }
.stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; margin: 6px 0; }
.stats4 div { border: 1.5px solid var(--ink); border-radius: 3px; background: #fff; font-size: 11px; }
.stats4 b { display: block; font-family: var(--hand); font-size: 22px; line-height: 1; }
.abil { font-size: 13px; margin: 6px 0; }
.abil b { font-family: var(--hand); font-size: 20px; }
.ctl { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.ctl .btn { font-size: 21px; padding: 7px 14px; }
.roster { display: flex; flex-direction: column; gap: 4px; }
.rrow { display: grid; grid-template-columns: 1fr 90px auto; gap: 8px; align-items: center; background: none; border: 0; text-align: left; padding: 2px 4px; cursor: pointer; border-radius: 3px; font-size: 13px; }
.rrow:hover, .rrow.on { background: #fff6fb; }
.rrow.done { color: var(--ink-soft); }
.rrow small { color: var(--ink-soft); }
.cons { font-size: 13px; }
.cons li { margin: 2px 0; }
.cons ul { margin: 4px 0 0; padding-left: 18px; }
.mv.attack .l { color: var(--you); }
.help { width: 34px; height: 34px; border-radius: 50%; border: 2px solid #f6e9d8; background: none; color: #f6e9d8; font-family: var(--hand); font-size: 26px; font-weight: 700; line-height: 1; cursor: pointer; align-self: center; }
.help:hover { background: #f6e9d8; color: var(--gum); }
.rules p { max-width: 68ch; }
.rules ul { margin: 4px 0 8px; padding-left: 20px; max-width: 68ch; }
.rules li { margin: 3px 0; }
.rules h3 { margin-top: 16px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; border-bottom: 2px solid var(--ink); }
.tab { font-family: var(--hand); font-size: 22px; background: none; border: 2px solid var(--ink); border-bottom: 0; border-radius: 4px 4px 0 0; padding: 4px 14px; cursor: pointer; margin-bottom: -2px; }
.tab.on { background: var(--ink); color: var(--card); }
.jobs-t td, .jobs-t th { padding: 3px 6px; }
.jobrow td { text-align: left; font-size: 13px; padding-bottom: 8px; }
.pro { color: #2e7d32; font-weight: 700; } .con { color: var(--you); font-weight: 700; }
.cons li.near { background: #fff6fb; margin-left: -4px; padding-left: 4px; border-radius: 3px; }
.reach { color: var(--you); font-weight: 700; font-size: 12px; }
.slide.picked, .job.chosen { background: var(--ink); color: var(--card); border-color: var(--ink); box-shadow: none; }
.slide.picked small, .job.chosen small { color: rgba(255, 253, 246, .75); }
.slide.picked .num { background: var(--card); color: var(--ink); }
.btn[hidden], .num[hidden] { display: none; }
#oops { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 40; background: var(--you); color: #fff; padding: 10px 14px; border-radius: 4px; font-size: 14px; box-shadow: 0 8px 20px rgba(0,0,0,.35); }
.num { display: inline-block; min-width: 22px; height: 22px; line-height: 22px; text-align: center; border-radius: 50%; background: var(--you); color: #fff; font-family: var(--body); font-size: 13px; font-weight: 700; }
.pres label { display: block; margin: 6px 0; font-size: 14px; }
.pres select { font: inherit; font-size: 14px; padding: 3px 6px; border: 2px solid var(--ink); border-radius: 4px; background: #fff; max-width: 100%; }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--ink); vertical-align: -1px; margin-right: 5px; }
</style>
</head>
<body>
<div class="table">
  <section class="pad" aria-label="The office floor">
    <header class="gum">
      <h1>The Outdoor Office</h1>
      <span class="where" id="where"></span>
      <div class="score" id="score"></div>
      <button class="help" id="help" aria-label="How it plays" title="How it plays">?</button>
    </header>
    <div class="boardwrap" id="boardwrap"><svg id="board" viewBox="0 0 1000 690" role="img" aria-label="Floor plan of the office with both parties on it"></svg></div>
    <details class="keybox" id="keybox"><summary>Key</summary><div class="legend" id="legend"></div></details>
  </section>
  <aside class="col">
    <div class="idx status" id="status"></div>
    <div class="idx moves" id="unitcard"></div>
    <div class="idx" id="rostercard"></div>
    <div class="idx minutes">
      <h2>Minutes</h2>
      <ol id="log" aria-live="polite"></ol>
    </div>
  </aside>
</div>
<div class="veil" id="veil" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="banner" id="banner" aria-hidden="true"></div>

<script>
/*__ENGINE__*/
</script>
<script>
const $ = s => document.querySelector(s);
// If anything breaks, say so on screen rather than failing silently.
function oops(msg) {
  let d = document.getElementById('oops');
  if (!d) { d = document.createElement('div'); d.id = 'oops'; d.setAttribute('role', 'alert'); document.body.appendChild(d); }
  d.textContent = `Something broke: ${msg}. Screenshot this line for Claude.`;
}
window.addEventListener('error', e => oops(e.message || 'unknown error'));
window.addEventListener('unhandledrejection', e => oops((e.reason && (e.reason.stack || e.reason.message)) || String(e.reason)));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const YOU = '#b8322a', THEM = '#2a5db0', INK = '#1f2440', PAD = '#fbf1a9', HI = '#ff9fd2';
const CS = 46, OX = 17, OY = 11;
const RELAX = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, RELAX ? Math.min(ms, 120) : ms));
const SHORT = ['CEO', 'Eng', 'IT', 'HR', 'Mkt', 'Sal', 'Law', 'Int', 'Stf'];
const HECKLES = ['Could have been an email!', 'Is this going to be on the test?', 'Next slide, please!', 'Who signed off on this?',
  'We tried that in 2019.', 'Does it scale, though?', 'Louder for the people at the water cooler!'];
const LABELS = [[3, 4, 'Your office'], [17, 4, 'Their office'], [12, 1, 'The Rock'], [14, 11, 'Lobby'], [3, 9, 'Your supplies'], [17, 9, 'Their supplies']];

let G = null;
const UI = { turn: null, sel: null, hover: null, plan: null, seen: 0 };
const PHONE = matchMedia('(max-width: 1000px)').matches;
// On touch screens a hover handler that changes the screen makes Safari swallow the tap. Only hover where there is a mouse.
const CAN_HOVER = matchMedia('(hover: hover)').matches;
UI.fold = { undecided: !PHONE, loot: !PHONE, lobby: !PHONE };
if (!PHONE) document.getElementById('keybox').open = true;
const cx = x => OX + x * CS + CS / 2, cy = y => OY + y * CS + CS / 2;
// Paper white shading into a side's ink as somebody warms to it.
function mix(hex, f) {
  const a = [0xff, 0xfd, 0xf6], b = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * f).toString(16).padStart(2, '0')).join('');
}
// The colour of an undecided person: who they lean to, and how far.
function leanFill(n) {
  const at = G.joinAt(n);
  if (n.kind === 'consultant' && n.side !== NONE) return n.side === P ? YOU : THEM;
  if (!n.amt || n.for === NONE) return '#fffdf6';
  return mix(n.for === P ? YOU : THEM, 0.25 + 0.55 * Math.min(1, n.amt / at));
}

function banner(text, ms = 1100) {
  const b = $('#banner'); b.textContent = text; b.classList.add('on');
  return sleep(ms).then(() => b.classList.remove('on'));
}
function unitTitle(u) {
  return `${u.name}, ${u.kind === 'contractor' ? 'contractor' : ROLE_NAME[u.job]}${u.leader ? ' (leader)' : ''}. Morale ${u.morale}/${u.max}. ${u.sway ? `Wavering: ${u.sway} of ${G.poachAt(u)} toward the ${u.side === P ? 'other side' : 'your side'}. ` : ''}` +
    `Charm ${u.stats[0]}, Guile ${u.stats[1]}, Hustle ${u.stats[2]}, Grit ${u.stats[3]}. Wants ${TASTE[u.taste]}. Carrying ${u.cards.length}.`;
}

// Icons for the places, drawn in pen at cell size.
const ICON = {
  data: (X, Y) => `<g stroke="${INK}" stroke-width="2.2" stroke-linecap="round"><line x1="${X + 13}" y1="${Y + 30}" x2="${X + 13}" y2="${Y + 22}"/><line x1="${X + 20}" y1="${Y + 30}" x2="${X + 20}" y2="${Y + 13}"/><line x1="${X + 27}" y1="${Y + 30}" x2="${X + 27}" y2="${Y + 18}"/><line x1="${X + 33}" y1="${Y + 30}" x2="${X + 33}" y2="${Y + 9}"/><line x1="${X + 9}" y1="${Y + 32}" x2="${X + 37}" y2="${Y + 32}"/></g>`,
  story: (X, Y) => `<g fill="#fff" stroke="${INK}" stroke-width="2" stroke-linejoin="round"><path d="M${X + 23} ${Y + 13} q-6 -4 -13 -1 v18 q7 -3 13 1 z"/><path d="M${X + 23} ${Y + 13} q6 -4 13 -1 v18 q-7 -3 -13 1 z"/></g><g stroke="${INK}" stroke-width="1.2" opacity=".6"><line x1="${X + 14}" y1="${Y + 18}" x2="${X + 20}" y2="${Y + 17}"/><line x1="${X + 14}" y1="${Y + 22}" x2="${X + 20}" y2="${Y + 21}"/><line x1="${X + 26}" y1="${Y + 17}" x2="${X + 32}" y2="${Y + 18}"/><line x1="${X + 26}" y1="${Y + 21}" x2="${X + 32}" y2="${Y + 22}"/></g>`,
  gadget: (X, Y) => { const c = `${X + 23} ${Y + 21}`; let g = `<g stroke="${INK}" stroke-width="3" stroke-linecap="round">`; for (let i = 0; i < 8; i++) g += `<line x1="${X + 23}" y1="${Y + 21 - 8}" x2="${X + 23}" y2="${Y + 21 - 12}" transform="rotate(${i * 45} ${c})"/>`; return g + `</g><circle cx="${X + 23}" cy="${Y + 21}" r="8" fill="#fff" stroke="${INK}" stroke-width="2.4"/><circle cx="${X + 23}" cy="${Y + 21}" r="3" fill="${INK}"/>`; },
  snacks: (X, Y) => `<text x="${X + 23}" y="${Y + 28}" text-anchor="middle" font-size="22" fill="${INK}">☕</text>`,
  rock: (X, Y) => `<path d="M${X + 12} ${Y + 12} l22 -4 l0 9 l-22 4 z" fill="#fff" stroke="${INK}" stroke-width="2" stroke-linejoin="round"/><rect x="${X + 19}" y="${Y + 20}" width="8" height="15" fill="#fff" stroke="${INK}" stroke-width="2"/><line x1="${X + 12}" y1="${Y + 36}" x2="${X + 34}" y2="${Y + 36}" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/><circle cx="${X + 31}" cy="${Y + 4}" r="2.2" fill="${INK}"/><line x1="${X + 31}" y1="${Y + 6}" x2="${X + 31}" y2="${Y + 9}" stroke="${INK}" stroke-width="1.6"/>`,
  lobby: (X, Y) => `<path d="M${X + 13} ${Y + 27} a10 10 0 0 1 20 0 z" fill="#fff" stroke="${INK}" stroke-width="2"/><line x1="${X + 9}" y1="${Y + 30}" x2="${X + 37}" y2="${Y + 30}" stroke="${INK}" stroke-width="2.4" stroke-linecap="round"/><circle cx="${X + 23}" cy="${Y + 14}" r="2" fill="${INK}"/><text class="hand" x="${X + 23}" y="${Y + 43}" text-anchor="middle" font-size="12" fill="${INK}" opacity=".7">reception</text>`,
  closet: (X, Y, open) => `<rect x="${X + 10}" y="${Y + 8}" width="26" height="30" rx="2" fill="${open ? 'none' : '#fff3c4'}" stroke="${INK}" stroke-width="2" ${open ? 'stroke-dasharray="3 3"' : ''}/>${open ? '' : `<line x1="${X + 23}" y1="${Y + 8}" x2="${X + 23}" y2="${Y + 38}" stroke="${INK}" stroke-width="1.6"/><circle cx="${X + 20}" cy="${Y + 24}" r="1.6" fill="${INK}"/><circle cx="${X + 26}" cy="${Y + 24}" r="1.6" fill="${INK}"/><text x="${X + 23}" y="${Y + 20}" text-anchor="middle" font-size="11" fill="${INK}">★</text>`}`,
};

// --- the floor ---------------------------------------------------------------
function drawBoard() {
  const sel = UI.sel ? G.byId(UI.sel) : null;
  const mine = UI.turn && sel && sel.side === P;
  const reach = mine && !sel.moved ? G.reach(sel).tiles : {};
  const W = A.W, H = A.H;
  let s = `<defs>
    <filter id="pen" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="2"/></filter>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><line x1="0" y1="0" x2="0" y2="7" stroke="${INK}" stroke-width="3"/></pattern>
    <pattern id="waves" width="16" height="8" patternUnits="userSpaceOnUse"><path d="M0 4 Q4 0 8 4 T16 4" fill="none" stroke="${THEM}" stroke-width="1.6"/></pattern>
  </defs>`;
  for (let y = 11; y < 690; y += 23) s += `<line x1="0" x2="1000" y1="${y}" y2="${y}" stroke="#9cc3d9" stroke-width="1" opacity=".6"/>`;
  // floor features
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = G.map[y][x], X = OX + x * CS, Y = OY + y * CS;
    if (t === 'a' || t === 'b') s += `<rect x="${X}" y="${Y}" width="${CS}" height="${CS}" fill="${t === 'a' ? YOU : THEM}" opacity=".08"/>`;
    if (t === 'R') s += `<rect x="${X + 1}" y="${Y + 1}" width="${CS - 2}" height="${CS - 2}" fill="#e6dcae"/>${ICON.rock(X, Y)}`;
    if (t === 'L') s += ICON.lobby(X, Y);
    if (reach[key(x, y)] !== undefined) s += `<rect x="${X + 2}" y="${Y + 2}" width="${CS - 4}" height="${CS - 4}" fill="${HI}" opacity=".45"/>`;
  }
  // walls, as one inked path
  let wp = '';
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (G.map[y][x] === '#') wp += `M${OX + x * CS} ${OY + y * CS}h${CS}v${CS}h-${CS}z`;
  s += `<path d="${wp}" fill="url(#hatch)" stroke="${INK}" stroke-width="1.2" filter="url(#pen)"/>`;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = G.map[y][x], X = OX + x * CS, Y = OY + y * CS;
    if (DESKS[t] !== undefined) {
      const st = G.stock[key(x, y)];
      s += `<g><title>${TASTE[DESKS[t]]} desk, ${st} card${st === 1 ? '' : 's'} left${st ? '' : '; cleared out'}</title><rect x="${X + 3}" y="${Y + 3}" width="${CS - 6}" height="${CS - 6}" fill="${st ? '#fff' : 'none'}" stroke="${INK}" stroke-width="2" ${st ? '' : 'stroke-dasharray="3 3"'} filter="url(#pen)"/>
        <g opacity="${st ? 1 : 0.35}">${ICON[['data', 'story', 'gadget', 'snacks'][DESKS[t]]](X, Y)}</g>`;
      for (let i = 0; i < st; i++) s += `<circle cx="${X + 9 + i * 7}" cy="${Y + 10}" r="2.4" fill="${INK}"/>`;
      s += `</g>`;
    }
    if (t === 'C' || t === 'c') {
      const inside = (G.closets[key(x, y)] || []).map(c => `${c.name} (${TASTE[c.taste]}, quality ${c.q})`).join(' and ');
      s += `<g><title>${t === 'C' ? (G.raidable(P, x) ? `Their supply closet, yours to raid: ${inside}` : `Your supply closet, locked to you and theirs to raid: ${inside}`) : 'An emptied supply closet'}</title>${ICON.closet(X, Y, t === 'c')}</g>`;
    }
  }
  for (const [x, y, l] of LABELS) s += `<text class="hand" x="${cx(x)}" y="${OY + y * CS + 11}" text-anchor="middle" font-size="17" fill="${INK}" opacity=".55">${l}</text>`;
  // loot on the floor
  for (const k in G.loot) {
    const [x, y] = k.split(',').map(Number), X = OX + x * CS, Y = OY + y * CS;
    s += `<g><title>${G.loot[k].length} card${G.loot[k].length === 1 ? '' : 's'} on the floor: ${esc(G.loot[k].map(c => c.name).join(', '))}</title>`;
    for (let i = 0; i < Math.min(3, G.loot[k].length); i++) s += `<rect x="${X + 12 + i * 3}" y="${Y + 10 + i * 3}" width="18" height="24" fill="#fff" stroke="${INK}" stroke-width="1.5" transform="rotate(${-8 + i * 8} ${X + CS / 2} ${Y + CS / 2})"/>`;
    s += `</g>`;
  }
  // the path of the move being planned
  const path = UI.plan || (UI.hover && UI.hover.path) || [];
  if (path.length > 1) s += `<polyline points="${path.map(([x, y]) => `${cx(x)},${cy(y)}`).join(' ')}" fill="none" stroke="${UI.plan ? THEM : YOU}" stroke-width="4" stroke-dasharray="7 5" stroke-linecap="round" opacity=".8"/>`;
  if (UI.hover && UI.hover.x !== undefined) s += `<rect x="${OX + UI.hover.x * CS}" y="${OY + UI.hover.y * CS}" width="${CS}" height="${CS}" fill="none" stroke="${YOU}" stroke-width="3" stroke-dasharray="4 3"/>`;
  // neutrals: the undecided, and the hired help in the Lobby
  const canPitch = pitchable();
  for (const n of G.neutrals) {
    const X = cx(n.x), Y = cy(n.y);
    const at = G.joinAt(n);
    const owner = n.kind === 'consultant' && n.side !== NONE ? (n.side === P ? YOU : THEM) : null;
    const fill = leanFill(n), lean = n.amt && n.for !== NONE ? (n.for === P ? YOU : THEM) : INK;
    const dark = !!owner || (n.amt && n.for !== NONE && n.amt / at >= 0.6);
    let title = n.kind === 'consultant' ? `${n.name}, consultant: ${n.what}. ${n.side === P ? 'Consulting for you.' : n.side === N ? 'Consulting for them.' : 'Uncommitted.'}`
      : n.kind === 'contractor' ? `${n.name}, contractor: ${n.what}. One pitch and they join your party for ${A.CONTRACT_TURNS} turns.`
      : `${n.name}, ${ROLE_NAME[n.role]}, undecided. Wants ${TASTE[n.taste]}.`;
    if (n.amt && !owner) title += ` Warming to ${n.for === P ? 'you' : 'them'} (${n.amt} of ${at}).`;
    s += `<g><title>${esc(title)}</title>`;
    if (canPitch.has(n.id)) s += `<circle cx="${X}" cy="${Y}" r="21" fill="${HI}" opacity=".75"/>`;
    if (n.kind === 'consultant') s += `<rect x="${X - 13}" y="${Y - 13}" width="26" height="26" rx="3" transform="rotate(45 ${X} ${Y})" fill="${fill}" stroke="${owner ? INK : lean}" stroke-width="${owner ? 1.8 : 2.4}"/>`;
    else if (n.kind === 'contractor') s += `<rect x="${X - 13}" y="${Y - 13}" width="26" height="26" rx="5" fill="#fffdf6" stroke="${INK}" stroke-width="1.8" stroke-dasharray="4 2"/>`;
    else s += `<circle cx="${X}" cy="${Y}" r="13" fill="${fill}" stroke="${lean}" stroke-width="${n.amt ? 2.6 : 1.6}"/>`;
    if (n.amt > 0 && !owner) s += `<circle cx="${X}" cy="${Y}" r="17" fill="none" stroke="${lean}" stroke-width="3" stroke-dasharray="${(n.amt / at) * 106.8} 120" opacity=".9"/>`;
    s += `<text x="${X}" y="${Y + 5}" text-anchor="middle" font-size="${n.kind === 'n' ? 14 : 11}" font-weight="${n.kind === 'n' ? 400 : 700}" fill="${dark ? '#fff' : INK}">${n.kind === 'n' ? TASTE_GLYPH[n.taste] : n.kind === 'consultant' ? 'C' : n.name.slice(0, 3)}</text>`;
    if (n.kind === 'n') s += `<text class="hand" x="${X}" y="${Y + 31}" text-anchor="middle" font-size="14" fill="${INK}" opacity=".85">${esc(n.name)}${n.arrived && G.turn - n.arrived <= 1 ? ' (new)' : ''}</text>`;
    if (n.kind === 'n' && n.arrived && G.turn - n.arrived <= 1) s += `<text x="${X + 11}" y="${Y - 10}" font-size="13" fill="${YOU}">✦</text>`;
    s += `</g>`;
  }
  // Where you can move, as a click layer above the labels, loot and paths, so nothing drawn there eats the click.
  for (const k in reach) {
    const [x, y] = k.split(',').map(Number);
    s += `<rect class="tile" data-x="${x}" data-y="${y}" x="${OX + x * CS}" y="${OY + y * CS}" width="${CS}" height="${CS}" fill="#000" fill-opacity="0" style="cursor:pointer"/>`;
  }
  // units
  for (const u of G.units) {
    if (u.sulk || u.gone || u.x < 0) continue;
    const X = cx(u.x), Y = cy(u.y), c = u.side === P ? YOU : THEM;
    const spent = u.side === G.side && u.acted;
    const isSel = sel === u;
    s += `<g class="unit" data-id="${u.id}" style="cursor:pointer" opacity="${spent ? 0.5 : 1}"><title>${esc(unitTitle(u))}</title>`;
    if (isSel) s += `<circle cx="${X}" cy="${Y}" r="22" fill="${HI}"/>`;
    if (u.kind === 'contractor') s += `<rect x="${X - 15}" y="${Y - 15}" width="30" height="30" rx="5" fill="${c}" stroke="${INK}" stroke-width="2"/>`;
    else s += `<circle cx="${X}" cy="${Y}" r="16" fill="${c}" stroke="${INK}" stroke-width="${u.leader ? 4 : 2}"/>`;
    if (u.leader) s += `<circle cx="${X}" cy="${Y}" r="12" fill="none" stroke="#fff" stroke-width="1.3"/>`;
    s += `<text x="${X}" y="${Y + 4.5}" text-anchor="middle" font-size="${u.kind === 'contractor' ? 10 : 12}" font-weight="700" fill="#fff">${u.kind === 'contractor' ? u.name.slice(0, 3) : SHORT[u.job]}</text>`;
    const f = u.morale / u.max;
    s += `<rect x="${X - 16}" y="${Y + 18}" width="32" height="5" fill="#fff" stroke="${INK}" stroke-width=".8"/><rect x="${X - 16}" y="${Y + 18}" width="${32 * f}" height="5" fill="${f < 0.34 ? '#e06a2a' : c}"/>`;
    if (u.cards.length) s += `<rect x="${X + 10}" y="${Y - 21}" width="12" height="15" fill="#fff" stroke="${INK}" stroke-width="1"/><text x="${X + 16}" y="${Y - 10}" text-anchor="middle" font-size="10" fill="${INK}">${u.cards.length}</text>`;
    if (u.rooted) s += `<text x="${X - 22}" y="${Y - 10}" font-size="14" fill="${INK}">⛓</text>`;
    if (u.sway > 0) { const at = G.poachAt(u), other = u.side === P ? THEM : YOU; s += `<circle cx="${X}" cy="${Y}" r="20" fill="none" stroke="${other}" stroke-width="3.5" stroke-dasharray="${(u.sway / at) * 125.7} 130" transform="rotate(-90 ${X} ${Y})"/>`; }
    s += `</g>`;
  }
  // the car park: everyone who is sulking, and how long for
  const parked = G.units.filter(u => u.sulk > 0 && !u.gone);
  const PY = OY + A.H * CS + 8;
  s += `<rect x="${OX}" y="${PY}" width="${A.W * CS}" height="52" fill="none" stroke="${INK}" stroke-width="1.6" stroke-dasharray="6 4" rx="4"/>`;
  s += `<text class="hand" x="${OX + 12}" y="${PY + 22}" font-size="18" fill="${INK}" opacity=".7">Car park</text>`;
  s += `<text x="${OX + 12}" y="${PY + 42}" font-size="11" fill="${INK}" opacity=".55">${parked.length ? 'sulking; back at 2 morale' : 'empty, for now'}</text>`;
  parked.forEach((u, i) => {
    const X = OX + 150 + i * 96, Y = PY + 26, c = u.side === P ? YOU : THEM;
    s += `<g class="unit" data-id="${u.id}" style="cursor:pointer"><title>${esc(u.name)}, sulking${u.sulk >= 99 ? ' for the rest of the match' : `, back in ${u.sulk} turn${u.sulk === 1 ? '' : 's'}`}</title>
      <circle cx="${X}" cy="${Y}" r="14" fill="${c}" stroke="${INK}" stroke-width="${u.leader ? 3.5 : 2}" opacity=".7"/>
      <text x="${X}" y="${Y + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${SHORT[u.job] || u.name.slice(0, 3)}</text>
      <text class="hand" x="${X + 20}" y="${Y + 5}" font-size="15" fill="${INK}">${u.sulk >= 99 ? 'out' : `back in ${u.sulk}`}</text></g>`;
  });
  const svg = $('#board');
  svg.innerHTML = s;
  // On a narrow screen, bring whoever was just picked (or is moving) into view.
  const wrap = $('#boardwrap');
  if (sel && sel.x >= 0 && UI.scrolledTo !== sel.id && wrap.scrollWidth > wrap.clientWidth + 4) {
    UI.scrolledTo = sel.id;
    const px = (cx(sel.x) / 1000) * svg.getBoundingClientRect().width;
    wrap.scrollTo({ left: Math.max(0, px - wrap.clientWidth / 2), behavior: RELAX ? 'auto' : 'smooth' });
  }
  const legendEl = $('#legend'); if (legendEl && !legendEl.innerHTML) legend();
  svg.querySelectorAll('.tile').forEach(el => el.addEventListener('click', () => {
    if (!UI.turn || !sel) return;
    G.moveUnit(sel, +el.dataset.x, +el.dataset.y);
    if (finished(sel)) nextUnit();
    render();
    afterStep();
  }));
  svg.querySelectorAll('.unit').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    const u = G.byId(+el.dataset.id);
    if (UI.turn && sel && sel.side === P && !sel.acted && u.side === N) {
      const a = G.actions(sel).find(a => a.kind === 'confront' && a.target === u.id);
      if (a) { doAct(sel, a); return; }
    }
    if (UI.turn && sel && sel.side === P && !sel.moved && u === sel) return;
    UI.sel = u.id; render();
  }));
}

// The neutrals the picked unit could pitch this turn: next to any tile it can still reach.
function pitchable() {
  const out = new Set();
  const u = UI.sel && UI.turn ? G.byId(UI.sel) : null;
  if (!u || u.side !== P || u.acted || u.sulk || u.gone) return out;
  const tiles = u.moved ? { [key(u.x, u.y)]: 0 } : G.reach(u).tiles;
  for (const k in tiles) {
    const [x, y] = k.split(',').map(Number);
    for (const [ax, ay] of G.adj(x, y)) { const n = G.neutralAt(ax, ay); if (n && !(n.kind === 'consultant' && n.side === P)) out.add(n.id); }
  }
  return out;
}

// --- the side column ---------------------------------------------------------
function render() {
  if (!G || !G.jobs) return;
  drawBoard();
  const a = G.active(P).length, b = G.active(N).length;
  $('#score').innerHTML = `<span class="y">you ${G.crowd[P].length} <small>follower${G.crowd[P].length === 1 ? '' : 's'}</small></span><span class="t">them ${G.crowd[N].length} <small>follower${G.crowd[N].length === 1 ? '' : 's'}</small></span>`;
  $('#where').textContent = G.over ? 'Match over' : `Turn ${G.turn} of ${A.TURNS}`;
  const d = G.demand(P);
  const canPitch = pitchable();
  const flags = [];
  if (G.rigged[P]) flags.push('Your projector is rigged. Get someone to the Rock and check it');
  if (G.rigged[N]) flags.push('You rigged their projector');
  $('#status').innerHTML = `<h2>${UI.turn ? 'Your turn' : G.side === N ? 'Their turn' : 'The office'}</h2>
    <p class="who">${a} of yours on the floor, ${b} of theirs. You hold ${G.hand(P).length} card${G.hand(P).length === 1 ? '' : 's'} (${G.bank[P].length} banked); they hold ${G.hand(N).length}.</p>
    ${G.fuse() ? '<p class="flags">All hands. Anyone broken now stays broken, and at the end every neutral goes with whoever has more people beside them.</p>' : G.turn >= A.HOLD_COST_FROM ? '<p class="who">Holding costs a point of morale now, except for interns and contractors.</p>' : ''}
    <p>Your crowd and party want</p>
    <div class="wants">${TASTE.map((t, i) => `<div><b>${d[i]}</b><span>${TASTE_GLYPH[i]} ${t}</span></div>`).join('')}</div>
    ${flags.length ? `<p class="flags">${flags.map(esc).join('. ')}.</p>` : ''}
    <details class="cons fold" data-f="undecided" ${UI.fold.undecided ? 'open' : ''}><summary><b>Undecided on the floor</b> <span class="who">(${G.neutrals.filter(n => n.kind === 'n').length}; two pitches each${canPitch.size ? `, ${canPitch.size} within reach of ${esc(G.byId(UI.sel).name)}` : ''})</span></summary>
      <ul>${G.neutrals.filter(n => n.kind === 'n').map(n => `<li class="${canPitch.has(n.id) ? 'near' : ''}"><span class="dot" style="background:${leanFill(n)};border-color:${n.amt && n.for !== NONE ? (n.for === P ? YOU : THEM) : INK}"></span><b>${esc(n.name)}</b>${n.arrived && G.turn - n.arrived <= 1 ? ' <span class="reach">new</span>' : ''}, ${ROLE_NAME[n.role]}, wants ${TASTE_GLYPH[n.taste]} ${TASTE[n.taste]}${n.amt ? `; <span style="color:${n.for === P ? YOU : THEM}">warming to ${n.for === P ? 'you' : 'them'} (${n.amt} of ${A.JOIN_AT})</span>` : ''}${canPitch.has(n.id) ? ' <span class="reach">in reach</span>' : ''}</li>`).join('') || '<li class="who">Nobody left to win over.</li>'}</ul></details>
    <details class="cons fold" data-f="loot" ${UI.fold.loot ? 'open' : ''}><summary><b>Worth going for</b> <span class="who">(a quality 3 slide is worth three desk cards)</span></summary><ul>
      ${Object.keys(G.closets).map(k => { const [x, y] = k.split(',').map(Number); const mine = !G.raidable(P, x); return `<li><b>${mine ? 'Your' : 'Their'} closet</b>${mine ? ' (only they can raid it)' : ''}: ${G.closets[k].map(c => `${TASTE_GLYPH[c.taste]} ${esc(c.name)} q${c.q}`).join(', ')}</li>`; }).join('')}
      ${Object.keys(G.loot).map(k => `<li><b>On the floor</b>: ${G.loot[k].map(c => `${TASTE_GLYPH[c.taste]} ${esc(c.name)} q${c.q}`).join(', ')}</li>`).join('')}
      ${Object.keys(G.closets).length + Object.keys(G.loot).length ? '' : '<li class="who">Nothing left lying about.</li>'}</ul></details>
    <details class="cons fold" data-f="lobby" ${UI.fold.lobby ? 'open' : ''}><summary><b>In the Lobby</b> <span class="who">(consultants take three pitches; contractors sign on one)</span></summary><ul>${G.neutrals.filter(n => n.kind !== 'n').map(n => `<li class="${canPitch.has(n.id) ? 'near' : ''}"><span class="dot" style="background:${n.kind === 'consultant' ? leanFill(n) : '#fffdf6'};border-color:${n.kind === 'consultant' && n.amt && n.for !== NONE ? (n.for === P ? YOU : THEM) : INK}"></span><b>${esc(n.name)}</b>${n.kind === 'consultant' ? (n.side === P ? ', <b>consulting for you</b>' : n.side === N ? `, <span style="color:${THEM}">consulting for them</span>` : n.amt ? `, warming to ${n.for === P ? 'you' : 'them'} (${n.amt} of 3)` : ', uncommitted') : ', contractor, waiting'}. <span class="who">${esc(n.what)}.</span>${canPitch.has(n.id) ? ' <span class="reach">in reach</span>' : ''}</li>`).join('')}</ul></details>`;
  $('#status').querySelectorAll('details.fold').forEach(d => d.ontoggle = () => { UI.fold[d.dataset.f] = d.open; });
  renderUnit();
  renderRoster();
  const log = G.log.slice(-60).reverse();
  const fresh = G.log.length - UI.seen;
  $('#log').innerHTML = log.map((e, i) => `<li class="s${e.side} ${i < fresh ? 'new' : ''}">${esc(e.text)}</li>`).join('');
  UI.seen = G.log.length;
}

function renderUnit() {
  const card = $('#unitcard');
  const u = UI.sel ? G.byId(UI.sel) : null;
  if (!u || u.sulk || u.gone) {
    card.innerHTML = `<h2>${UI.turn ? 'Pick someone' : 'Watching'}</h2><p class="waiting">${UI.turn ? `${PHONE ? 'Tap' : 'Click'} one of your people on the floor.` : 'Their party is moving…'}</p>
      ${UI.turn ? `<div class="ctl">${endTurnButton()}</div>` : ''}`;
    const e = $('#endturn'); if (e) e.onclick = endTurn;
    return;
  }
  const mine = u.side === P;
  const ab = u.kind === 'staff' && u.job >= 0 ? ABILITY[u.job] : null;
  let h = `<div class="unit"><h3 style="color:${mine ? YOU : THEM}">${esc(u.name)}</h3>
    <p class="job">${u.kind === 'contractor' ? `Contractor, back to the Lobby after turn ${u.expires - 1}` : ROLE_NAME[u.job]}${u.leader ? ', leader' : ''}. Wants ${TASTE[u.taste]}. Moves ${G.moveOf(u)}${u.cards.length >= A.HEAVY_LOAD ? ', slowed by the load' : ''}.</p>
    <div class="bar ${mine ? '' : 'them'}"><i style="width:${100 * u.morale / u.max}%"></i></div><p class="who">Morale ${u.morale} of ${u.max}</p>
    <div class="stats4">${STAT_NAME.map((n, i) => `<div><b>${u.stats[i]}</b>${n}</div>`).join('')}</div>
    ${ab ? `<p class="abil"><b>${ab.name}</b>: ${esc(ab.what)}. ${u.cd ? `Ready in ${u.cd} turn${u.cd === 1 ? '' : 's'}.` : 'Ready.'}</p>` : ''}
    <div class="chips">${u.cards.length ? u.cards.map(c => `<span class="chip">${TASTE_GLYPH[c.taste]} ${esc(c.name)} <small>q${c.q}</small></span>`).join('') : '<span class="who">No cards.</span>'}</div></div>`;
  let acts = [];
  if (UI.turn && mine) {
    if (u.acted) h += `<p class="waiting">${u.moved || stuck(u) ? 'Done for this turn.' : `Action done. You can still move: ${PHONE ? 'tap' : 'click'} a pink tile, or pick someone else.`}</p>`;
    else {
      acts = G.actions(u);
      if (!u.moved) h += `<p class="who">Move and act, in either order: ${PHONE ? 'tap' : 'click'} a pink tile to move, or act from here first.</p>`;
      h += `<div class="cards">${acts.map((o, i) => `<button class="mv ${o.kind === 'confront' || o.kind === 'poach' ? 'attack' : ''} ${['rig', 'pickpocket'].includes(o.kind) ? 'trick' : ''}" data-i="${i}"><span class="l">${esc(o.label)}</span><span class="st"></span><span class="s">${esc(o.sub)}</span></button>`).join('')}</div>`;
    }
    h += `<div class="ctl">${u.from && !u.acted ? '<button class="btn alt" id="undo">Undo move</button>' : ''}${endTurnButton()}</div>`;
  }
  card.innerHTML = h;
  card.querySelectorAll('.mv').forEach(btn => {
    const o = acts[+btn.dataset.i];
    btn.onclick = () => doAct(u, o);
    if (CAN_HOVER) {
      const on = () => { UI.hover = o.x !== undefined ? { x: o.x, y: o.y } : null; drawBoard(); };
      btn.onmouseenter = on; btn.onfocus = on;
      btn.onmouseleave = () => { UI.hover = null; drawBoard(); };
    }
  });
  const un = $('#undo'); if (un) un.onclick = () => { G.undoMove(u); render(); };
  const e = $('#endturn'); if (e) e.onclick = endTurn;
}

function renderRoster() {
  const row = u => {
    const where = u.gone ? 'gone' : u.sulk >= 99 ? 'out for the match' : u.sulk ? `sulking, back in ${u.sulk}` : `${u.morale}/${u.max}${u.sway ? `, wavering ${u.sway}/${G.poachAt(u)}` : ''}`;
    return `<button class="rrow ${UI.sel === u.id ? 'on' : ''} ${(u.side === P && UI.turn && u.acted) || u.sulk ? 'done' : ''}" data-id="${u.id}" ${u.sulk || u.gone ? 'disabled' : ''}>
      <span>${esc(u.name)} <small>${u.kind === 'contractor' ? 'contractor' : ROLE_NAME[u.job]}${u.cards.length ? `, ${u.cards.length} card${u.cards.length === 1 ? '' : 's'}` : ''}</small></span>
      <span class="bar ${u.side === P ? '' : 'them'}"><i style="width:${100 * u.morale / u.max}%"></i></span><small>${where}</small></button>`;
  };
  const list = s => G.units.filter(u => u.side === s && !u.gone);
  $('#rostercard').innerHTML = `<h2>The parties</h2><div class="roster">${list(P).map(row).join('')}</div>
    <p class="who" style="margin:8px 0 4px">Theirs</p><div class="roster">${list(N).map(row).join('')}</div>`;
  $('#rostercard').querySelectorAll('.rrow').forEach(b => b.onclick = () => { UI.sel = +b.dataset.id; render(); });
}

// A unit is done when it has nothing left to choose: its action is used (or only Hold is left) and its move is used (or it cannot go anywhere).
function stuck(u) { return Object.keys(G.reach(u).tiles).length <= 1; }
function onlyHold(u) { return G.actions(u).every(a => a.kind === 'wait'); }
function finished(u) { return (u.acted || onlyHold(u)) && (u.moved || stuck(u)); }
function afterStep() {
  if (G.over || !UI.turn) return;
  if (G.active(P).every(finished)) {
    const idle = G.active(P).filter(v => !v.acted);
    UI.turn && banner(idle.length ? 'Nothing left to do' : 'Everyone has gone', 700).then(() => { if (!UI.turn) return; for (const v of idle) G.act(v, { kind: 'wait' }); finishTurn(); });
  }
}
function nextUnit() {
  const cur = UI.sel ? G.byId(UI.sel) : null;
  if (cur && cur.side === P && !cur.sulk && !finished(cur)) return;
  const next = G.active(P).find(v => !v.acted && !finished(v));
  UI.sel = next ? next.id : null;
}
function doAct(u, o) {
  UI.hover = null;
  G.act(u, o);
  if (!G.over) nextUnit();
  render();
  afterStep();
  if (G.over && UI.turn) { const r = UI.turn; UI.turn = null; r(); }
}
function endTurn() {
  if (!UI.turn) return;
  const left = G.active(P).filter(v => !v.acted && !finished(v));
  if (left.length) {
    if (!$('#veil').hidden) return;
    sheet(`<h2>End the turn for all?</h2><p>${left.length === 1 ? `${esc(left[0].name)} has` : `${left.length} of yours have`} not gone yet: ${left.map(v => esc(v.name)).join(', ')}. ${left.some(v => G.holdCost(v)) ? `${left.filter(v => G.holdCost(v)).map(v => esc(v.name)).join(', ')} will lose a point of morale for holding.` : 'They will simply hold.'}</p>
      <div class="row"><button class="btn alt" id="no">Keep playing</button><button class="btn" id="yes">End the turn</button></div>`,
      el => { el.querySelector('#no').onclick = closeSheet; el.querySelector('#yes').onclick = () => { closeSheet(); for (const v of left) G.act(v, { kind: 'wait' }); finishTurn(); }; });
    return;
  }
  finishTurn();
}
function finishTurn() { const r = UI.turn; UI.turn = null; UI.sel = null; r(); }
function endTurnButton() {
  const left = G.active(P).filter(v => !v.acted && !finished(v)).length;
  return `<button class="btn ${left ? 'alt' : ''}" id="endturn" title="${left ? left + ' still to go' : 'Everyone has gone'}">End turn for all${left ? ` (${left} left)` : ''}</button>`;
}

// --- sheets -------------------------------------------------------------------
function sheet(html, wire) {
  $('#sheet').innerHTML = html;
  $('#veil').hidden = false;
  document.body.style.overflow = 'hidden';
  if (wire) wire($('#sheet'));
  const f = $('#sheet').querySelector('button:not(:disabled)'); if (f) f.focus({ preventScroll: true });
}
function closeSheet() { $('#veil').hidden = true; $('#sheet').innerHTML = ''; document.body.style.overflow = ''; }

function setupFlow() {
  return new Promise(done => {
    const cfg = { role: 0, stats: [0, 0, 0, 0], party: [] };
    let base = [0, 0, 0, 0];
    const pageJob = () => sheet(`<h2>Who are you?</h2>
      <p>You lead a party through a small office for eight turns: arguing their people down, looting the desks between you and the closets behind them, winning the crowd over. Then three slides each decide it, unless you break their whole party first.</p>
      <div class="jobs">${PLAYABLE.map(r => `<button class="job" data-r="${r}"><b>${ROLE_NAME[r]}</b>
        <small>${ABILITY[r].name}: ${esc(ABILITY[r].what)}</small><small>Wants ${ROLE_TASTES[r].map(t => TASTE[t]).join(' or ')}</small>
        <small>${ROLE_STATS[r].map((v, i) => `${STAT_NAME[i]} ${v}`).join(', ')}</small><small class="con">${esc(JOB_CON[r])}</small></button>`).join('')}</div>
      <p class="who">Full pros and cons are under the ? once you are in.</p>`,
      el => el.querySelectorAll('.job').forEach(b => b.onclick = () => { cfg.role = +b.dataset.r; base = ROLE_STATS[cfg.role].slice(); cfg.stats = base.slice(); pageStats(); }));
    const pageStats = () => {
      const left = A.FREE_POINTS - cfg.stats.reduce((a, v, i) => a + v - base[i], 0);
      sheet(`<h2>${ROLE_NAME[cfg.role]}. Spend four points.</h2>
        ${STAT_NAME.map((n, i) => `<div class="stat"><b>${n}</b><small>${STAT_WHAT[i]}</small>
          <button class="pm" data-i="${i}" data-d="-1" aria-label="less ${n}" ${cfg.stats[i] <= base[i] ? 'disabled' : ''}>−</button>
          <span class="v">${cfg.stats[i]}</span>
          <button class="pm" data-i="${i}" data-d="1" aria-label="more ${n}" ${left <= 0 || cfg.stats[i] >= A.STAT_MAX ? 'disabled' : ''}>+</button></div>`).join('')}
        <p style="margin-top:10px">${left} point${left === 1 ? '' : 's'} left. Morale is ${9 + 2 * cfg.stats[3]}; you move ${3 + Math.floor(cfg.stats[2] / 2)} tiles, one less when carrying three cards.</p>
        <div class="row"><button class="btn alt" id="back">Pick another job</button><button class="btn" id="next">Choose your party</button></div>`,
        el => {
          el.querySelectorAll('.pm').forEach(b => b.onclick = () => { cfg.stats[+b.dataset.i] += +b.dataset.d; pageStats(); });
          el.querySelector('#back').onclick = pageJob;
          el.querySelector('#next').onclick = pageParty;
        });
    };
    const pageParty = () => sheet(`<h2>Who fights beside you?</h2>
      <p>Up to four colleagues, each a unit you move, with their job's ability. Your nemesis brings as many as you do.</p>
      <div class="jobs">${PLAYABLE.map(r => { const n = cfg.party.filter(x => x === r).length; return `<button class="job ${n ? 'chosen' : ''}" data-r="${r}" ${cfg.party.length >= 4 && !n ? 'disabled' : ''}><b>${n ? `${ROLE_NAME[r]}${n > 1 ? ' ×' + n : ''}` : '+ ' + ROLE_NAME[r]}</b><small>${ABILITY[r].name}: ${esc(ABILITY[r].what)}</small></button>`; }).join('')}</div>
      <p class="who">${cfg.party.length} of 4 chosen. ${cfg.party.length >= 4 ? 'Take one out below to change your mind.' : 'The same job can come twice.'}</p>
      <h3>Your party</h3><div class="chips">${cfg.party.length ? cfg.party.map((r, i) => `<button class="chip" data-x="${i}" aria-label="remove ${ROLE_NAME[r]}">${ROLE_NAME[r]} ✕</button>`).join('') : '<span class="who">Just you so far. One break and you are out.</span>'}</div>
      <div class="row"><button class="btn alt" id="back">Back to stats</button><button class="btn" id="go">Into the office</button></div>`,
      el => {
        el.querySelectorAll('.job').forEach(b => b.onclick = () => { if (cfg.party.length < 4) cfg.party.push(+b.dataset.r); pageParty(); });
        el.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { cfg.party.splice(+b.dataset.x, 1); pageParty(); });
        el.querySelector('#back').onclick = pageStats;
        el.querySelector('#go').onclick = () => { closeSheet(); done(cfg); };
      });
    pageJob();
  });
}

function talkSheet(T, mode, resolve) {
  const S = T.sides[P], E = T.sides[N];
  const fans = TASTE.map((_, i) => G.fans(T, P, i));
  const meter = (X, cls) => { const tot = Math.max(X.claps + X.boos, 1); return `<div class="meter ${cls}"><div class="c" style="width:${100 * X.claps / tot}%"></div><div class="b" style="width:${100 * X.boos / tot}%"></div></div><div class="tally">${X.claps} claps, ${X.boos} boos</div>`; };
  let body = `<h2>${mode === 'pick' ? (S.hand.length >= 3 ? 'Pick your three slides' : 'Pick your slides') : 'The final talks'}</h2>
    <p>In the room for you: ${S.audience.length} of yours, ${S.booers.length} of theirs to boo. For them: ${E.audience.length} of theirs, ${E.booers.length} of yours.${S.blanked ? ` Your projector was rigged: ${esc(S.blanked.name)} came up blank.` : ''}</p>
    <div class="wants">${TASTE.map((n, i) => `<div><b>${fans[i]}</b><span>${TASTE_GLYPH[i]} ${n}</span></div>`).join('')}</div>`;
  let wire = null;
  if (mode === 'pick') {
    // Built once; taps update it in place, so the card you touched is still there when the tap lands.
    const picked = [], by = {};
    const pres = G.presenters(P);
    const want = Math.min(3, S.hand.length);
    const claps = (c, u) => G.slideClaps(T, P, c, u);
    const presHtml = () => picked.length ? `<h3>Who presents each</h3>${picked.map((i, k) => { const c = S.hand[i]; return `<label><span class="num">${k + 1}</span> ${TASTE_GLYPH[c.taste]} ${esc(c.name)}: <select data-k="${i}">${pres.map(u => `<option value="${u.id}" ${(by[i] ?? G.leader(P).id) === u.id ? 'selected' : ''}>${esc(u.name)}${u.leader ? '' : ` (${ROLE_NAME[u.job]}, Charm ${u.stats[0]})`}: about ${claps(c, u.id)} claps${c.taste === 2 && G.gadgetHand(u) ? ', knows gadgets' : ''}</option>`).join('')}</select></label>`; }).join('')}` : '';
    const countText = () => picked.length < want ? `Pick ${want - picked.length} more.` : 'All picked. Choose who presents each, then present.';
    body += `<p class="who">${S.hand.length ? `${PHONE ? 'Tap' : 'Click'} ${want === 1 ? 'your card' : `${want} cards, in the order they go up`}; ${PHONE ? 'tap' : 'click'} a black one to put it back.` : 'You have no cards at all.'} Their slides stay hidden until the two sides alternate, and a slide that repeats the taste the room just saw gets nothing.</p>
      <div class="row">${S.hand.map((c, i) => `<button class="slide" data-i="${i}" aria-pressed="false">
        <b><span class="num" hidden></span> ${TASTE_GLYPH[c.taste]} ${esc(c.name)}</b><small>quality ${c.q}; ${fans[c.taste]} in your room want ${TASTE[c.taste]}; about ${claps(c, G.leader(P).id)} claps if you present it</small></button>`).join('')}</div>
      <div class="pres" id="presbox"></div>
      <div class="stick"><p class="who" id="pickcount">${countText()}</p>
      <button class="btn" id="go" ${S.hand.length ? 'hidden' : ''}>${S.hand.length ? (want === 1 ? 'Present it' : 'Present these') : 'Go up empty-handed'}</button></div>`;
    wire = el => {
      const refresh = () => {
        el.querySelectorAll('.slide').forEach(b => {
          const k = picked.indexOf(+b.dataset.i);
          b.classList.toggle('picked', k >= 0);
          b.setAttribute('aria-pressed', k >= 0 ? 'true' : 'false');
          const n = b.querySelector('.num'); n.hidden = k < 0; n.textContent = k >= 0 ? k + 1 : '';
        });
        const box = el.querySelector('#presbox'); box.innerHTML = presHtml();
        box.querySelectorAll('select').forEach(sel => sel.onchange = () => { by[+sel.dataset.k] = +sel.value; });
        el.querySelector('#pickcount').textContent = countText();
        el.querySelector('#go').hidden = S.hand.length > 0 && picked.length < want;
      };
      el.querySelectorAll('.slide').forEach(b => b.onclick = e => {
        e.preventDefault();
        const i = +b.dataset.i; const k = picked.indexOf(i);
        if (k >= 0) picked.splice(k, 1); else if (picked.length < want) picked.push(i);
        refresh();
      });
      el.querySelector('#go').onclick = () => { closeSheet(); resolve(picked.map(i => ({ i, by: by[i] ?? G.leader(P).id }))); };
    };
  } else {
    body += `<p><b style="color:${YOU}">You</b></p>${meter(S, '')}<p style="margin-top:8px"><b style="color:${THEM}">Them</b></p>${meter(E, 'them')}
      ${T.lines.length ? `<ol class="lines">${T.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ol>` : ''}`;
    if (mode === 'heckle') {
      const who = S.booers[Math.floor(Math.random() * S.booers.length)];
      const pr = G.presenter(P, S.heckledBy);
      body += `<p class="heckle">${who ? esc(who.name) + ': ' : ''}“${esc(HECKLES[Math.floor(Math.random() * HECKLES.length)])}”</p>
        <p class="who">${pr.leader ? 'You are' : esc(pr.name) + ' is'} at the lectern, with Grit ${pr.stats[3]}.</p>
        <div class="row"><button class="btn alt" id="ign">Let it go, +${G.ignoreCost(P, pr.id)} boos</button><button class="btn" id="cb">Clap back, ${Math.round(100 * G.heckleOdds(P, pr.id))}% to land</button></div>
        <p class="who" style="margin-top:8px">Landing is +10 claps. Missing is +6 boos.</p>`;
      wire = el => { el.querySelector('#ign').onclick = () => resolve(false); el.querySelector('#cb').onclick = () => resolve(true); };
    } else if (mode === 'end') {
      body += `<h3>You ${S.score}, them ${E.score}</h3><div class="row"><button class="btn" id="ok">The verdict</button></div>`;
      wire = el => el.querySelector('#ok').onclick = () => { closeSheet(); resolve(); };
    }
  }
  sheet(body, wire);
}

function verdict() {
  return new Promise(res => {
    const w = G.winner;
    const head = w === P ? 'You take the office.' : w === N ? 'Your nemesis takes the office.' : 'Dead level.';
    const why = G.how === 'rout' ? (w === P ? 'Their entire party is sulking in the car park at once.' : 'Your entire party is sulking in the car park at once.')
      : `Final talks: you ${G.scores[P]}, them ${G.scores[N]}${G.scores[P] === G.scores[N] ? ', settled on the size of the crowd' : ''}.`;
    sheet(`<h2>${head}</h2><p>${why}</p>
      <table class="rc"><thead><tr><th></th><th style="color:${YOU}">You</th><th style="color:${THEM}">Them</th></tr></thead><tbody>
      <tr><td>Enemies broken</td><td>${G.breaks[P]}</td><td>${G.breaks[N]}</td></tr>
      <tr><td>Followers</td><td>${G.crowd[P].length}</td><td>${G.crowd[N].length}</td></tr>
      <tr><td>Cards brought to the talk</td><td>${G.hand(P).length}</td><td>${G.hand(N).length}</td></tr>
      <tr><td>Consultants at the end</td><td>${G.consultants().filter(n => n.side === P).length}</td><td>${G.consultants().filter(n => n.side === N).length}</td></tr>
      </tbody></table><div class="row"><button class="btn" id="ok">Play again</button></div>`,
      el => el.querySelector('#ok').onclick = () => { closeSheet(); res(); });
  });
}

const RULES = [
  ['How to start', `<p>Pick a job: it sets your starting stats, what you want to hear in a talk, and your ability. Spend four points on Charm, Guile, Hustle and Grit. Then choose up to four colleagues. Each is a unit you will move, with their own job and ability. Your nemesis is dealt a job and brings as many colleagues as you did.</p>
    <p>The two parties start in their offices at either end of one small floor. The desks are in the middle, the Rock at the top, the Lobby at the bottom, and each side's supply closets are behind its office.</p>`],
  ['A turn', `<p>The match is eight turns. Each turn, both parties go: whoever opened the last turn closes this one. On your go, every one of your people may move up to their move (3, plus one for every two points of Hustle) and do one thing, in either order:</p>
    <ul><li><b>Argue</b> with an enemy on an adjacent tile. Your Charm against their Grit, in morale; they answer back for half.</li>
    <li><b>Take a card</b> from an adjacent desk. Two per desk, and they do not restock.</li>
    <li><b>Raid</b> the other side's supply closet. What is inside is written on the door: two slides of quality 2 or 3, each worth two or three desk cards at the talk. Your own closets are locked to you.</li>
    <li><b>Pitch</b> somebody undecided. Two pitches and they are your follower. Pitching someone the other side has been courting wears that down first.</li>
    <li><b>Use the job ability</b>, then wait three turns for it to come back. Most need the target next to you; the ones that reach further are shouted, or sent over the network.</li>
    <li><b>Poach</b> one of theirs standing next to you. Three pitches and they change sides, bringing their cards; two if their morale is 3 or less; one for a contractor. They steady by a point each turn, so it takes two of you, or a run of turns. Leaders cannot be poached, and your people can be poached back.</li>
    <li><b>Pickpocket</b> an enemy who is carrying cards.</li>
    <li><b>Bank</b> your cards in your own office, or <b>rig</b> or <b>check</b> the projector at the Rock.</li>
    <li><b>Hold.</b> From turn 4, holding costs a point of morale, whether you chose to or had nothing in reach. Interns and contractors are used to standing about and pay nothing.</li></ul>
    <p>The turn ends by itself once nobody has anything left to choose. Or press <b>End turn for all</b>: anyone who has not acted holds.</p>`],
  ['Morale and breaking', `<p>Morale is a unit's health. At zero they are demoralised: they drop every card they carry onto the floor and sulk in the car park for two turns, coming back at 2 morale. Contractors simply quit.</p>
    <p>In the last two turns, anyone broken stays broken. Break the whole enemy party at once and you win on the spot.</p>`],
  ['Followers', `<p>Followers are the only thing you keep. Every undecided person on the floor can be won over, and every one you win fills a seat at your final talk, wanting a particular taste of slide. A room full of people who want Data makes a Data slide land; a room that wants nothing you brought stays quiet.</p>
    <p>The office is not a closed room. Now and then somebody new walks in, through the Lobby or by the Rock, marked ✦ new on the floor. They stop arriving at all hands.</p>
    <p>When time is called, every undecided person still on the floor goes with whichever party has more people standing beside them. Where your units end the last turn matters.</p>`],
  ['The Lobby', `<p>Consultants and contractors wait in the Lobby and are won by pitching, like anyone else. A consultant takes three pitches, then gives your side a standing rule for the rest of the match; the other side can pitch them back. A contractor signs on one pitch, joins your party for two turns, and then goes back to the Lobby to be signed again.</p>`],
  ['Ending and winning', `<p>After the eighth turn, both sides present. Each picks three slides (or every card, if they hold fewer) from what their party still holds, banked or carried, without seeing the other's, and chooses who stands up with each one: anyone of yours still on the floor. The presenter's Charm goes into the slide, an Engineer or IT makes a Gadget slide land harder, and whoever holds the second slide takes the heckle with their Grit. The slides then go up in turns, one side then the other.</p>
    <p>A slide scores its quality times (2 + 3 × the people in your room who want that taste), times a little for the presenter's Charm. A slide of the same taste as the one the room just saw, from either side, scores nothing. Every enemy unit in the room boos each of your slides, and one of them heckles you: let it go for a few boos, or clap back for a big gain or a bigger loss. A rigged projector blanks your best slide unless somebody checked it.</p>
    <p>Higher claps minus boos takes the office. A tie goes to the bigger crowd.</p>`],
  ['What the numbers mean', `<ul><li><b>Followers</b> in the header: seats in your room at the talk, by taste.</li>
    <li><b>Your crowd and party want</b>: how many in your room want each taste. Fetch cards to match.</li>
    <li><b>Cards held</b>: what you can bring to the talk. Quality 1 from desks, 2 or 3 from closets. Banked cards cannot be lost.</li>
    <li><b>Morale</b> on every token and in the roster. Orange means one more argument breaks them.</li>
    <li><b>Warming</b> on the undecided: pitches so far out of the pitches they need, in the colour of the side they lean to.</li>
    <li><b>Wavering</b>: a ring in the other side's colour round one of your people means they are being poached. Get them away, or break whoever is doing it.</li>
    <li><b>Moves</b> on the unit card: how far they go this turn, one less when carrying three cards.</li></ul>`],
  ['Notes on strategy', `<ul><li>The desks empty fast and are between you. Whoever gets there first with two units usually keeps them.</li>
    <li>Fetch what your room wants, not what is nearest. Three Data slides in a row score once.</li>
    <li>Carriers are targets. Bank early, or send a fast unit home with the closet loot.</li>
    <li>Argue in pairs. One unit softens, the next breaks, and the cards fall to whoever is standing there.</li>
    <li>A unit at 2 morale that just came back is bait, and the other side knows it. It is also easier to poach than to break: two pitches, and you keep them.</li>
    <li>Stand near the doors. Newcomers arrive undecided and next to whoever is there.</li>
    <li>Spend the last two turns standing next to the undecided. All hands rewards bodies, not cards.</li>
    <li>Consultants are three actions for a whole-match rule. The Keynote Coach alone is worth about nine claps.</li>
    <li>Keep your Charm on the floor for the talk. A broken presenter cannot stand up, and the leader's Grit is not always the best answer to a heckle.</li></ul>`],
];
const JOBS_TAB = () => `<p>Every unit has a job. The job sets the four stats, one taste of slide they want to hear, and one ability on a three-turn cooldown. Your own job also decides what your talk lands.</p>
  <table class="rc jobs-t"><thead><tr><th>Job</th><th>Charm</th><th>Guile</th><th>Hustle</th><th>Grit</th><th>Wants</th></tr></thead><tbody>
  ${PLAYABLE.map(r => `<tr><td><b>${ROLE_NAME[r]}</b></td>${ROLE_STATS[r].map(v => `<td>${v}</td>`).join('')}<td style="text-align:left">${ROLE_TASTES[r].map(t => TASTE_GLYPH[t] + ' ' + TASTE[t]).join(', ')}</td></tr>
  <tr class="jobrow"><td colspan="6"><b>${ABILITY[r].name}</b>: ${esc(ABILITY[r].what)}.<br><span class="pro">For:</span> ${esc(JOB_PRO[r])}<br><span class="con">Against:</span> ${esc(JOB_CON[r])}</td></tr>`).join('')}</tbody></table>
  <p class="who">Colleagues get one extra point in each of their job's two best stats. Contractors from the Lobby have no job and no ability.</p>`;
const TASTES_TAB = () => `<p>Everyone in the office wants to hear one of four things. Your crowd's tastes decide which slides land at the talk: a slide scores its quality times (2 + 3 × the people in your room who want that taste).</p>
  <table class="rc"><thead><tr><th>Taste</th><th>Who wants it</th><th>Where the cards are</th></tr></thead><tbody>
  ${TASTE.map((t, i) => `<tr><td style="text-align:left"><b>${TASTE_GLYPH[i]} ${t}</b></td><td style="text-align:left">${PLAYABLE.filter(r => ROLE_TASTES[r].includes(i)).map(r => ROLE_NAME[r]).join(', ')}, and Staff</td><td style="text-align:left">${['the Data desks, top middle', 'the Story desks, bottom middle', 'the Gadget desk, centre; quality 2 when an Engineer or IT takes it; the Engineer can build one', 'the Snacks desk, centre'][i]}</td></tr>`).join('')}
  </tbody></table>
  <p>Desk cards are quality 1; the supply closets hold quality 2 and 3 slides of any taste. The panel beside the board totals what your room wants right now; the list of the undecided says what each of them wants, so you can pitch the ones who match the cards you hold, or fetch the cards to match the people you have.</p>
  <p>Two cautions. A slide of the same taste as the one the room just saw, from either side, scores nothing, so three Data slides in a row score once. And your room is only your followers and your party: their people in the room boo, they do not want anything.</p>`;
const HELP_TABS = [
  ['Rules', () => RULES.filter(([h]) => h !== 'Notes on strategy').map(([h, b]) => `<h3>${h}</h3>${b}`).join('')],
  ['Jobs', JOBS_TAB],
  ['Tastes', TASTES_TAB],
  ['Strategy', () => RULES.filter(([h]) => h === 'Notes on strategy').map(([, b]) => b).join('')],
];
function howToPlay(tab = 0) {
  if (!$('#veil').hidden && !$('#sheet').querySelector('.tabs')) return;
  sheet(`<h2>How it plays</h2><div class="tabs">${HELP_TABS.map(([t], i) => `<button class="tab ${i === tab ? 'on' : ''}" data-i="${i}">${t}</button>`).join('')}</div>
    <div class="rules">${HELP_TABS[tab][1]()}</div>
    <div class="row"><button class="btn" id="ok">Back to the office</button></div>`,
    el => { el.querySelector('#ok').onclick = closeSheet; el.querySelectorAll('.tab').forEach(b => b.onclick = () => howToPlay(+b.dataset.i)); });
}
$('#help').onclick = () => howToPlay(0);
document.addEventListener('keydown', e => { if (e.key === '?' && $('#veil').hidden) howToPlay(0); });

// --- wiring ---------------------------------------------------------------------
const agent = {
  playTurn() { return new Promise(res => { UI.turn = res; nextUnit(); render(); }); },
  pickSlides(T) { return new Promise(res => talkSheet(T, 'pick', res)); },
  chooseHeckle(T) { return new Promise(res => talkSheet(T, 'heckle', res)); },
};
const hooks = {
  async turnStart() {
    UI.sel = null; render();
    await banner(G.side === P ? `Turn ${G.turn}` : 'Their turn', G.side === P ? 900 : 600);
  },
  async enemyPlan(u, p) {
    UI.sel = u.id;
    const path = G.pathTo(u, p.x, p.y);
    UI.plan = [[u.x, u.y], ...path];
    render();
    await sleep(420);
    UI.plan = null;
  },
  async enemyActed() { render(); await sleep(380); },
  async allHands() { render(); await banner('All hands', 1000); },
  async talkStart(T) { talkSheet(T, 'watch'); await sleep(700); },
  async talkUpdate(T) { talkSheet(T, 'watch'); await sleep(RELAX ? 100 : 750); },
  async talkEnd(T) { await new Promise(res => talkSheet(T, 'end', res)); },
  async matchEnd() { render(); await verdict(); start(); },
};

async function start() {
  G = new Game((Date.now() ^ (Math.random() * 1e9)) >>> 0);
  Object.assign(UI, { turn: null, sel: null, hover: null, plan: null, seen: 0 });
  const cfg = await setupFlow();
  G.setup(cfg);
  G.say(NONE, `Your nemesis is ${ROLE_NAME[G.jobs[N]]}, with ${G.parties[N].map(r => ROLE_NAME[r]).join(', ') || 'nobody'}.`);
  render();
  G.run(agent, hooks);
}
start();
</script>
</body>
</html>
